<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}</style>
<title>分析報告書套印</title>
<style>
/* Layout: 單欄表單在上、即時預覽在下；寬螢幕並排。藍色＝套印內容 */
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#1a2230; --muted:#5b6678; --line:#d3d9e2;
  --accent:#1f4e9c; --accent-ink:#ffffff; --ok:#1d7a4d; --warn:#a85a00; --warn-bg:#fff1dd; --ok-bg:#e3f4ea;
  --field:#f7f9fb; --chip-on:#dbe6f7;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171f; --card:#1b222d; --ink:#e6ebf2; --muted:#9aa5b6; --line:#2e3846;
  --accent:#6fa0ee; --accent-ink:#0c1522; --ok:#6cd09b; --warn:#ffb866; --warn-bg:#3a2a12; --ok-bg:#16301f; --field:#141a23; --chip-on:#27406b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171f; --card:#1b222d; --ink:#e6ebf2; --muted:#9aa5b6; --line:#2e3846;
  --accent:#6fa0ee; --accent-ink:#0c1522; --ok:#6cd09b; --warn:#ffb866; --warn-bg:#3a2a12; --ok-bg:#16301f; --field:#141a23; --chip-on:#27406b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.wrap{grid-template-columns:minmax(0,440px) minmax(0,1fr);align-items:start}.head{grid-column:1/-1}.preview{position:sticky;top:16px}}
h1{font-size:1.35rem;margin:0;letter-spacing:.02em}
.head p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px;min-width:0}
h2{font-size:.78rem;letter-spacing:.12em;color:var(--muted);margin:0;font-weight:600}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=tel]{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
.row2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chip{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:6px;padding:7px 11px;cursor:pointer;text-align:left}
.seg button[aria-pressed=true],.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px}
.unit span{color:var(--muted);font-size:.9rem}
.badge{padding:10px 12px;border-radius:8px;font-size:.9rem;font-weight:500}
.badge.need{background:var(--warn-bg);color:var(--warn)}
.badge.noneed{background:var(--ok-bg);color:var(--ok)}
.note{font-size:.8rem;color:var(--muted);margin:0}
.hint{font-size:.82rem;color:var(--ok);margin:0;min-height:1.2em}
.primary{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:13px 16px;font-size:1rem;cursor:pointer;width:100%}
.ghost{font:inherit;font-size:.88rem;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:8px 12px;cursor:pointer}
#status{min-height:1.4em;font-size:.88rem;color:var(--muted);margin:0}
.preview{display:grid;gap:10px;min-width:0}
.sheet{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;line-height:0}
.sheet canvas{width:100%;height:auto;display:block}
.pv-note{font-size:.8rem;color:var(--muted);margin:0}
details.sec{border:1px solid var(--line);border-radius:8px;background:var(--field)}
details.sec>summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:.92rem}
details.sec .inner{padding:4px 12px 12px;display:grid;gap:14px}
.grp{display:grid;gap:8px;min-width:0}
.grp h3{margin:0;font-size:.85rem;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sub{display:grid;gap:8px;padding-left:12px;border-left:2px solid var(--line)}
</style>
</head>
<body>

<div class="wrap">
  <div class="head">
    <h1>分析報告書套印</h1>
    <p>詮國保險經紀人 旅平險分析報告書。資料只在這支手機的瀏覽器內處理，不會上傳。</p>
  </div>

  <form class="form" id="form" style="display:grid;gap:16px;min-width:0">
    <section class="card">
      <h2>案件類型</h2>
      <div class="seg" id="preset">
        <button type="button" data-p="school" aria-pressed="true">學校團體</button>
        <button type="button" data-p="person" aria-pressed="false">個人客戶</button>
        <button type="button" data-p="custom" aria-pressed="false">自行填寫</button>
      </div>
      <div id="schoolBox" class="grp">
        <h3>學校</h3>
        <div class="seg" id="schoolPick"></div>
        <details class="sec" id="schoolMgr">
          <summary>管理學校資料</summary>
          <div class="inner">
            <label>選擇要修改的學校
              <select id="schSel" style="font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);width:100%"></select>
            </label>
            <label>按鈕名稱（簡稱）<input type="text" id="sLabel" autocomplete="off"></label>
            <label>要保人名稱（全名）<input type="text" id="sName" autocomplete="off"></label>
            <div class="row2">
              <label>法人代表人<input type="text" id="sRep" autocomplete="off"></label>
              <label>統一編號<input type="text" id="sUid" autocomplete="off"></label>
              <label>業務員一證號<input type="text" id="sC1" autocomplete="off" autocapitalize="characters"></label>
              <label>業務員二證號<input type="text" id="sC2" autocomplete="off" autocapitalize="characters"></label>
            </div>
            <div class="seg">
              <button type="button" id="schSave">儲存</button>
              <button type="button" id="schDel">刪除這間</button>
            </div>
            <p class="note" id="schNote">學校資料存在這支手機的瀏覽器裡，換裝置或清除網站資料後需重新建立。</p>
          </div>
        </details>
      </div>
      <p class="note" id="presetNote"></p>
    </section>

    <div id="guided" style="display:grid;gap:16px;min-width:0">
      <section class="card">
        <h2>要保人</h2>
        <label><span id="holderLbl">要保人名稱</span><input type="text" id="holder" autocomplete="off"></label>
        <div class="row2" id="repBox">
          <label>法人代表人<input type="text" id="rep" autocomplete="off"></label>
          <label>統一編號<input type="text" id="uidOrg" autocomplete="off"></label>
        </div>
        <div id="personBox" style="display:grid;gap:10px">
          <div class="row2">
            <label>身分證字號<input type="text" id="pid" autocomplete="off" autocapitalize="characters" maxlength="10"></label>
            <label>出生年月日（民國）<input type="text" id="pbirth" inputmode="numeric" autocomplete="off" placeholder="例如 0780415"></label>
          </div>
          <p class="hint" id="pidHint"></p>
          <label>職業（選填）<input type="text" id="pjob" autocomplete="off"></label>
        </div>
      </section>

      <section class="card">
        <h2>要保人與被保險人的關係</h2>
        <div class="seg" id="rel">
          <button type="button" data-v="self" aria-pressed="true">本人</button>
          <button type="button" data-v="spouse" aria-pressed="false">配偶</button>
          <button type="button" data-v="child" aria-pressed="false">子女</button>
          <button type="button" data-v="parent" aria-pressed="false">父母</button>
          <button type="button" data-v="rep" aria-pressed="false">代表人</button>
        </div>
        <label style="grid-auto-flow:column;justify-content:start;align-items:center;gap:8px;color:var(--ink)">
          <input type="checkbox" id="grp" style="width:18px;height:18px"> 被保險人是團體（詳名冊）
        </label>
        <div id="insBox" class="sub" hidden>
          <label>被保險人姓名<input type="text" id="iname" autocomplete="off"></label>
          <div class="row2">
            <label>身分證字號<input type="text" id="iid" autocomplete="off" autocapitalize="characters" maxlength="10"></label>
            <label>出生年月日（民國）<input type="text" id="ibirth" inputmode="numeric" autocomplete="off" placeholder="例如 1010203"></label>
          </div>
          <p class="hint" id="iidHint"></p>
          <label>職業（選填）<input type="text" id="ijob" autocomplete="off"></label>
        </div>
      </section>

      <section class="card">
        <h2>保險期間（民國）</h2>
        <div class="row">
          <label>年<input type="number" id="yy" inputmode="numeric"></label>
          <label>月<input type="number" id="mm" inputmode="numeric"></label>
          <label>日<input type="number" id="dd" inputmode="numeric"></label>
          <label>時<input type="number" id="hh" inputmode="numeric"></label>
          <label>共幾天<input type="number" id="days" inputmode="numeric"></label>
        </div>
      </section>

      <section class="card">
        <h2>保險內容</h2>
        <label>保險公司名稱<input type="text" id="co" autocomplete="off"></label>
        <div class="seg" id="coQuick">
          <button type="button" data-v="國泰" aria-pressed="false">國泰</button>
          <button type="button" data-v="美商安達" aria-pressed="false">美商安達</button>
        </div>
        <div class="seg" id="kind">
          <button type="button" data-v="life" aria-pressed="false">人壽</button>
          <button type="button" data-v="prop" aria-pressed="false">產物</button>
        </div>
        <div class="row">
          <label>總保額
            <span class="unit"><input type="number" id="sum" inputmode="numeric"><span>萬元</span></span>
          </label>
          <label>保費合計
            <span class="unit"><input type="number" id="prem" inputmode="numeric"><span>元</span></span>
          </label>
        </div>
        <div class="badge" id="badge" role="status"></div>
      </section>

      <section class="card">
        <h2>證號與簽署日期</h2>
        <div class="row2">
          <label>業務員一證號<input type="text" id="certTop" autocomplete="off" autocapitalize="characters"></label>
          <label>業務員二證號<input type="text" id="certBot" autocomplete="off" autocapitalize="characters"></label>
        </div>
        <div class="row">
          <label>簽署年<input type="number" id="sgy" inputmode="numeric"></label>
          <label>月（選填）<input type="number" id="sgm" inputmode="numeric"></label>
          <label>日（選填）<input type="number" id="sgd" inputmode="numeric"></label>
        </div>
        <p class="note">只填一個證號時，會貼齊底線。簽署月、日留空時，保留給客戶親筆。</p>
      </section>
    </div>

    <div id="customBox" style="display:grid;gap:16px;min-width:0" hidden>
      <section class="card">
        <h2>自行填寫</h2>
        <p class="note">下方列出表單上所有可勾選與可填寫的欄位。藍色按鈕代表會打勾。開啟前一個類型的設定當起點，改完直接儲存。</p>
        <button type="button" class="ghost" id="reseed">以目前類型的預設重新帶入</button>
        <div id="customList" style="display:grid;gap:10px"></div>
      </section>
    </div>

    <section class="card">
      <h2>檔案</h2>
      <label>活動名稱（選填，會放進檔名）<input type="text" id="event" autocomplete="off" placeholder="例如：合唱團比賽(40人)"></label>
      <label>檔名<input type="text" id="fname" autocomplete="off"></label>
      <button type="button" class="primary" id="save">儲存 PDF</button>
      <p id="status"></p>
    </section>
  </form>

  <aside class="preview">
    <div class="sheet"><canvas id="pv" width="10" height="14"></canvas></div>
    <p class="pv-note">預覽。藍色是套印的內容，列印後直接簽名即可。</p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>

/* ---------- 身分證判斷 ---------- */
function idInfo(id){
  id = (id||'').toUpperCase().trim();
  if(/^[A-Z][12]\d{8}$/.test(id)) return {nat:'tw', sex: id[1]==='1'?'M':'F'};
  if(/^[A-Z][89]\d{8}$/.test(id)) return {nat:'fo', sex: id[1]==='8'?'M':'F'};
  if(/^[A-Z][A-D]\d{8}$/.test(id)) return {nat:'fo', sex: 'AC'.includes(id[1])?'M':'F'};
  return null;
}
function idText(id){
  const r = idInfo(id);
  if(!r) return id ? '格式看不出性別，請自行確認' : '';
  return (r.sex==='M'?'男':'女')+'、'+(r.nat==='tw'?'本國籍':'外國籍')+'（依身分證字號自動判斷）';
}
function normBirth(s){
  s = String(s||'').trim(); if(!s) return '';
  let m = s.match(/^(\d{2,3})\D+(\d{1,2})\D+(\d{1,2})\D*$/);
  if(!m){ const d=s.replace(/\D/g,''); if(d.length===7) m=[0,d.slice(0,3),d.slice(3,5),d.slice(5,7)]; else if(d.length===6) m=[0,d.slice(0,2),d.slice(2,4),d.slice(4,6)]; }
  if(!m) return s;
  return m[1]+'/'+String(m[2]).padStart(2,'0')+'/'+String(m[3]).padStart(2,'0');
}

/* ---------- 產生 PDF ---------- */
async function cjkImage(doc, text, size, rgb){
  const S = 6, pad = 2;
  const cv = document.createElement('canvas'), g = cv.getContext('2d');
  const font = `${size*S}px ${CJK_FONT}`;
  g.font = font;
  const w = Math.ceil(g.measureText(text).width) + pad*S*2;
  const h = Math.ceil(size*S*1.4);
  cv.width = w; cv.height = h;
  g.font = font; g.fillStyle = `rgb(${rgb.map(v=>Math.round(v*255)).join(',')})`;
  g.textBaseline = 'alphabetic';
  g.fillText(text, pad*S, size*S*1.08);
  const blob = await new Promise(r=>cv.toBlob(r,'image/png'));
  const img = await doc.embedPng(new Uint8Array(await blob.arrayBuffer()));
  return {img, w:w/S, h:h/S, pad, base:size*1.08, textW:(w-2*pad*S)/S};
}

async function buildPdf(st){
  const { PDFDocument, rgb, StandardFonts } = PDFLib;
  const doc = await PDFDocument.load(TPL_BYTES);
  const page = doc.getPage(0);
  const hel = await doc.embedFont(StandardFonts.Helvetica);
  const white = rgb(1,1,1), blue = rgb(...BLUE);
  const wiped = [];
  const wipe = (x0,t0,x1,t1)=>{ wiped.push([x0,t0,x1,t1]); page.drawRectangle({x:x0,y:PAGE_H-t1,width:x1-x0,height:t1-t0,color:white,borderWidth:0}); };

  // 1. 只蓋掉範本裡原本就有的 15 個藍色勾，不碰方框線；之後依狀態重畫勾
  for(const [x0,t0,x1,t1] of BASE_TICKS) wipe(x0-0.5,t0-0.5,x1+0.5,t1+0.5);
  // 2. 清除範本原有的學校資料
  for(const k in F) if(F[k].wipe) wipe(...F[k].wipe);
  // 白色塊如果碰到表格線，把線補回去，文字底下不留白底
  for(const [a,b,c,d] of LINES){
    if(wiped.some(w=>c>w[0] && a<w[2] && d>w[1] && b<w[3]))
      page.drawRectangle({x:a,y:PAGE_H-d,width:c-a,height:d-b,color:rgb(0,0,0),borderWidth:0});
  }

  const draw = async (f,text)=>{
    const ascii = /^[\x20-\x7e]+$/.test(text);
    let size = f.s || 8;
    let x = f.k==='b' ? f.x0+2 : f.x;
    const top = f.t;
    if(f.k==='b'){
      const maxW = f.x1-f.x0-3;
      let w = ascii ? hel.widthOfTextAtSize(text,size) : text.length*size;
      if(w>maxW) size = Math.max(5.5, size*maxW/w);
    }
    if(ascii){
      const w = hel.widthOfTextAtSize(text,size);
      if(f.al==='c') x = f.x - w/2;
      page.drawText(text,{x, y:PAGE_H-(top+size*0.8), size, font:hel, color:blue});
    } else {
      const r = await cjkImage(doc,text,size,BLUE);
      let px = x - r.pad;
      if(f.al==='c') px = f.x - r.textW/2 - r.pad;
      const baseY = PAGE_H-(top+size*0.88);
      page.drawImage(r.img,{x:px, y:baseY-(r.h-r.base), width:r.w, height:r.h});
    }
  };
  const texts = {...st.texts};
  if(texts.certTop && !texts.certBot){ texts.certBot = texts.certTop; delete texts.certTop; }  // 只有一個證號時貼齊底線
  for(const k in texts){ if(F[k] && texts[k]) await draw(F[k], texts[k]); }

  const o = {thickness:1.1,color:blue};
  for(const id of st.checks){
    const b = BOXES[id], y = PAGE_H-b.t;
    page.drawLine({start:{x:b.x+1.6,y:y-4.4},end:{x:b.x+3.6,y:y-7.2},...o});
    page.drawLine({start:{x:b.x+3.6,y:y-7.2},end:{x:b.x+7.9,y:y-1.3},...o});
  }
  return await doc.save();
}

/* ---------- 檔名與提示 ---------- */
function suggestName(v){
  const co = v.co.replace(/^美商/,'');
  const k = v.kind==='life'?'人壽':v.kind==='prop'?'產物':'';
  const kk = (/產物|人壽/.test(co))?'':k;
  const holder = (v.holder||'').replace(/^桃園市中壢區/,'') || '客戶';
  const date = [v.yy||'yyy',(v.mm||'mm').padStart(2,'0'),(v.dd||'dd').padStart(2,'0')].join('.');
  return `${date}-${holder}${co}${kk}旅平險${v.event?'-'+v.event:''}-詮國新版分析報告`;
}

let renderTok = 0, timer = 0;
function currentState(){
  if(state.preset==='custom' && state.custom) return state.custom;
  return derive(vals());
}
async function render(){
  const tok = ++renderTok;
  const v = vals();
  const isCustom = state.preset==='custom';
  // 提示：總保額是否超過 500 萬
  const sumTxt = isCustom ? (state.custom.texts.prod_sum||'') : v.sum;
  const sum = Number(sumTxt);
  const b = $('badge');
  if(!sumTxt || isNaN(sum)){ b.className='badge'; b.textContent='請輸入總保額'; }
  else if(sum>500){ b.className='badge need'; b.textContent=`總保額 ${sum} 萬，超過 500 萬，需附詮國分析報告書。`; }
  else { b.className='badge noneed'; b.textContent=`總保額 ${sum} 萬，未超過 500 萬，可不附分析報告書。`; }
  $('pidHint').textContent = idText(v.pid);
  $('iidHint').textContent = idText(v.iid);
  if(!state.fnameTouched) $('fname').value = suggestName(isCustom ? customVals(v) : v);
  try{
    const bytes = await buildPdf(currentState());
    if(tok!==renderTok) return;
    window.__lastBytes = bytes;
    const pdf = await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
    const pg = await pdf.getPage(1);
    const vp = pg.getViewport({scale:2});
    const cv = $('pv'); cv.width = vp.width; cv.height = vp.height;
    await pg.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
    $('status').textContent='';
  }catch(e){ console.error(e); $('status').textContent = '預覽失敗：' + (e && e.message || e); }
}

function syncRelUI(){
  const isRep = state.rel==='rep';
  $('repBox').hidden = !isRep;
  $('personBox').hidden = isRep;
  $('holderLbl').textContent = isRep ? '要保人名稱（學校／法人）' : '要保人姓名';
  $('insBox').hidden = (isRep || state.rel==='self');
  $('grp').disabled = isRep;
  if(isRep) $('grp').checked = true;
  else if(state.rel==='self' && $('grp').dataset.auto==='1'){ $('grp').checked=false; }
  $('grp').dataset.auto = '0';
  setPressed($('rel'), $('rel').querySelector(`[data-v="${state.rel}"]`));
}
function syncCoUI(){
  const v=$('co').value.trim();
  $('coQuick').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===v?'true':'false'));
  $('kind').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===state.kind?'true':'false'));
}

function setIdentityBlank(){
  for(const k of ['holder','rep','uidOrg','pid','pbirth','pjob','iname','iid','ibirth','ijob','sgm','sgd']) $(k).value = '';
  $('sgy').value = '115';
}
function applySchool(id){
  state.school = id;
  const sc = schools.find(x=>x.id===id);
  $('holder').value = sc ? sc.name : '';
  $('rep').value = sc ? sc.rep : '';
  $('uidOrg').value = sc ? sc.uid : '';
  $('certTop').value = sc ? sc.c1 : 'HB0L794757';
  $('certBot').value = sc ? sc.c2 : '';
  renderSchoolPick();
}
function renderSchoolPick(){
  const box = $('schoolPick'); box.innerHTML='';
  const add=(id,label)=>{ const b=document.createElement('button'); b.type='button'; b.dataset.s=id; b.textContent=label; b.setAttribute('aria-pressed', state.school===id?'true':'false'); box.appendChild(b); };
  schools.forEach(x=>add(x.id,x.label||x.name));
  add('__free','自行輸入');
  const sel = $('schSel'); const cur = sel.value; sel.innerHTML='';
  schools.forEach(x=>{ const o=document.createElement('option'); o.value=x.id; o.textContent=x.label||x.name; sel.appendChild(o); });
  const n=document.createElement('option'); n.value='__new'; n.textContent='＋新增學校'; sel.appendChild(n);
  sel.value = [...sel.options].some(o=>o.value===cur)?cur:(schools[0]?schools[0].id:'__new');
  loadSchoolForm();
}
function loadSchoolForm(){
  const sc = schools.find(x=>x.id===$('schSel').value);
  $('sLabel').value = sc?sc.label:''; $('sName').value = sc?sc.name:''; $('sRep').value = sc?sc.rep:'';
  $('sUid').value = sc?sc.uid:''; $('sC1').value = sc?sc.c1:''; $('sC2').value = sc?sc.c2:'';
}
function applyType(t, initial){
  state.type = t; state.custom = null;
  const wasSample = state.sample;
  setIdentityBlank();
  if(initial){ for(const k in SAMPLE) $(k).value = SAMPLE[k]; }
  else if(wasSample){ for(const k in SAMPLE) $(k).value=''; $('hh').value='0'; state.sample=false; }
  if(t==='school'){
    state.rel='rep'; state.kind='prop'; $('co').value='國泰';
    $('grp').checked = true;
    applySchool(initial ? 'puren' : (state.school||'puren'));
    if(!$('days').value) $('days').value='1';
  } else {
    state.rel='self'; state.kind='prop'; $('co').value='美商安達';
    $('grp').checked = false;
    $('certTop').value='HB0L794757'; $('certBot').value='';
  }
  $('presetNote').textContent = t==='school' ? (state.sample ? '目前帶入的是範本原值（115.10.22 普仁國小），請改成本案資料。' : '') : '個人客戶：預設本人投保、美商安達、只填一個證號。';
  $('schoolBox').hidden = t!=='school';
  syncRelUI(); syncCoUI();
  state.fnameTouched=false;
}

/* ---------- 自行填寫介面 ---------- */
function buildCustomUI(){
  const root = $('customList'); root.innerHTML='';
  let det=null, inner=null;
  GROUPS.forEach(g=>{
    if(g.sec || !det){
      det = document.createElement('details'); det.className='sec';
      const sm = document.createElement('summary'); sm.textContent = g.sec||'其他'; det.appendChild(sm);
      inner = document.createElement('div'); inner.className='inner'; det.appendChild(inner);
      root.appendChild(det);
    }
    const box = document.createElement('div'); box.className='grp';
    const h = document.createElement('h3'); h.textContent = g.title; box.appendChild(h);
    const chips = document.createElement('div'); chips.className='chips';
    g.rows.forEach(r=>{
      BOXES.filter(b=>Math.abs(b.t-r)<1.6).sort((a,b)=>a.x-b.x).forEach(b=>{
        const btn = document.createElement('button'); btn.type='button'; btn.className='chip';
        btn.textContent = b.label || '（無標籤）'; btn.dataset.id=b.id;
        btn.setAttribute('aria-pressed', state.custom.checks.has(b.id)?'true':'false');
        btn.addEventListener('click',()=>{
          const on = !state.custom.checks.has(b.id);
          if(on) state.custom.checks.add(b.id); else state.custom.checks.delete(b.id);
          btn.setAttribute('aria-pressed', on?'true':'false'); schedule();
        });
        chips.appendChild(btn);
      });
    });
    if(chips.children.length) box.appendChild(chips);
    if(g.fields){
      const fr = document.createElement('div'); fr.className='row2';
      g.fields.forEach(k=>{
        const lb = document.createElement('label'); lb.textContent = F[k].l;
        const inp = document.createElement('input'); inp.type='text'; inp.id='cf_'+k; inp.autocomplete='off';
        inp.value = state.custom.texts[k]||'';
        inp.addEventListener('input',()=>{ if(inp.value.trim()) state.custom.texts[k]=inp.value.trim(); else delete state.custom.texts[k]; schedule(); });
        lb.appendChild(inp); fr.appendChild(lb);
      });
      box.appendChild(fr);
    }
    inner.appendChild(box);
  });
  det && root.firstChild && (root.firstChild.open = true);
}
function seedCustom(){
  const d = derive(vals());
  state.custom = {texts:{...d.texts}, checks:new Set(d.checks)};
  buildCustomUI();
}
function showMode(){
  const c = state.preset==='custom';
  $('guided').hidden = c; $('customBox').hidden = !c;
}

/* ---------- 事件 ---------- */
document.querySelectorAll('#guided input').forEach(el=>el.addEventListener('input',()=>{
  if(el.id==='pid' || el.id==='iid') el.value = el.value.toUpperCase();
  schedule();
}));
$('grp').addEventListener('change',schedule);
['event'].forEach(id=>$(id).addEventListener('input',schedule));
$('fname').addEventListener('input',()=>{ state.fnameTouched=true; });
$('form').addEventListener('submit',e=>e.preventDefault());
$('rel').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; state.rel=b.dataset.v; syncRelUI(); schedule(); });
$('kind').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; state.kind=b.dataset.v; syncCoUI(); schedule(); });
$('coQuick').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; $('co').value=b.dataset.v; syncCoUI(); schedule(); });
$('co').addEventListener('input',()=>{ syncCoUI(); });
$('preset').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const p=b.dataset.p; setPressed($('preset'),b);
  if(p==='custom'){
    state.type='custom'; seedCustom(); showMode();
    $('schoolBox').hidden = true;
    $('presetNote').textContent='自行填寫：已帶入前一個類型的設定當起點，所有欄位都能改。';
  } else {
    applyType(p,false); showMode();
  }
  schedule();
});
$('schoolPick').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  applySchool(b.dataset.s); state.fnameTouched=false; schedule();
});
$('schSel').addEventListener('change',loadSchoolForm);
$('schSave').addEventListener('click',()=>{
  const id = $('schSel').value;
  const rec = {label:$('sLabel').value.trim(), name:$('sName').value.trim(), rep:$('sRep').value.trim(), uid:$('sUid').value.trim(), c1:$('sC1').value.trim().toUpperCase(), c2:$('sC2').value.trim().toUpperCase()};
  if(!rec.label && !rec.name){ $('schNote').textContent='請至少填按鈕名稱或要保人名稱。'; return; }
  if(id==='__new'){ rec.id='s'+Date.now(); schools.push(rec); $('schSel').value=rec.id; }
  else { const i=schools.findIndex(x=>x.id===id); schools[i]={...schools[i],...rec}; }
  saveSchools(); renderSchoolPick();
  if(state.school===($('schSel').value)) applySchool(state.school);
  $('schNote').textContent='已儲存。'; schedule();
});
$('schDel').addEventListener('click',()=>{
  const id=$('schSel').value; if(id==='__new') return;
  schools = schools.filter(x=>x.id!==id); saveSchools();
  if(state.school===id) state.school='__free';
  renderSchoolPick(); $('schNote').textContent='已刪除。'; schedule();
});
['yy','mm','dd','hh','days','sum','prem'].forEach(id=>$(id).addEventListener('input',()=>{ if(state.sample && state.type==='school') $('presetNote').textContent=''; state.sample=false; }));
$('reseed').addEventListener('click',()=>{ seedCustom(); schedule(); });

let downloads=null;
$('save').addEventListener('click', async ()=>{
  const st=$('status'); st.textContent='產生中…';
  try{
    const bytes = await buildPdf(currentState());
    const name = ($('fname').value.trim()||'分析報告書').replace(/[\\/:*?"<>|]/g,'_') + '.pdf';
    const blob = new Blob([bytes],{type:'application/pdf'});
    if(downloads){
      await downloads.save({filename:name, data:blob});
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),30000);
    }
    st.textContent='已交給瀏覽器儲存：'+name;
  }catch(e){
    st.textContent = e && e.code==='declined' ? '已取消儲存。' : '儲存失敗：'+(e && e.message || e);
  }
});
(async()=>{
  try{ downloads = await (window.claude && window.claude.use ? window.claude.use('downloads') : null); }catch(e){ downloads=null; }
})();

renderSchoolPick(); applyType('school',true); showMode();
render();
</script>

</body>
</html>
